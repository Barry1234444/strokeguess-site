name: Enable GitHub Pages
on:
  push:
    branches: [main]
permissions:
  pages: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Publish from main at repository root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          payload='{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X POST "${auth[@]}" -d "$payload" "https://api.github.com/repos/${repo}/pages")
          echo "POST /pages -> ${code}"
          cat /tmp/pages.json
          echo
          if [ "$code" = "201" ]; then
            exit 0
          fi
          if [ "$code" = "409" ]; then
            put=$(curl -sS -o /tmp/pages-put.json -w "%{http_code}" -X PUT "${auth[@]}" -d "$payload" "https://api.github.com/repos/${repo}/pages")
            echo "PUT /pages -> ${put}"
            cat /tmp/pages-put.json
            echo
            if [ "$put" = "204" ] || [ "$put" = "200" ]; then
              exit 0
            fi
          fi
          exit 1
